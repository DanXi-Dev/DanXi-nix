pluginManagement {
    def flutterSdkPath = {
        def envFlutterSdkPath = System.getenv("FLUTTER_ROOT")?.trim()
        if (envFlutterSdkPath) {
            return envFlutterSdkPath
        }
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def propFlutterSdkPath = properties.getProperty("flutter.sdk")
        assert propFlutterSdkPath != null, "flutter.sdk not set in env or local.properties"
        return propFlutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.13.2" apply false
    id "org.jetbrains.kotlin.android" version "2.2.21" apply false
}

include ":app"
